# CI：push/PR 时跑全量单元测试。
# 后端套件纯标准库、不依赖网络与 .env（llm_client.load_env_file 对缺失文件直接
# 返回，测试用例自带临时库与假 LLM）；前端 *.test.mjs 用 Node 原生 test
# runner，同样零依赖——所以没有任何安装步骤，检出即跑。
#
# 前端测试用 shell glob 展开而不是逐个列文件名：新增测试文件自动纳入，
# 不会再出现"写了测试但忘了加进 CI"的情况。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 后端单元测试
        working-directory: backend
        run: python -m unittest discover -s tests -t .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 前端单元测试
        run: node --test frontend/*.test.mjs
